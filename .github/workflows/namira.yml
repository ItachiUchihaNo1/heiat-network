name: Namira PHP - Test and deploy FTPS
on:
  push:
    branches: [main]
    paths: ['namira/**', '.github/workflows/namira.yml']
  pull_request:
    branches: [main, codex/store-v21-catalog, codex/mobile-navigation, codex/calls-complete]
    paths: ['namira/**', '.github/workflows/namira.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: namira-test-shahidpics
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: namira_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - name: PHP extensions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-mysql php-sqlite3 php-gd php-xml php-mbstring php-zip
      - name: Shared mobile navigation model
        run: |
          php namira/tests/mobile-navigation.php
          node --check namira/public/assets/mobile-navigation.js
      - name: PHP syntax
        run: find namira -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Versioned deployment and shared configuration tests
        run: |
          python3 namira/tests/deploy.py
          php namira/tests/release-paths.php
      - name: Upload progress behavior checks
        run: node namira/tests/upload-progress.cjs
      - name: Large image and client preview checks
        run: |
          node namira/tests/image-previews.cjs
          php namira/tests/large-images.php
      - name: SQLite behavior tests
        run: php namira/tests/run.php
      - name: Protocol acceptance tests on SQLite
        run: php namira/tests/protocol.php
      - name: Platform preservation and admin tests on SQLite
        run: php namira/tests/platform.php
      - name: Community workflows and private file tests on SQLite
        run: php namira/tests/community.php
      - name: Martyr catalog and form preservation tests on SQLite
        run: php namira/tests/martyr-catalog.php
      - name: Admin direct publishing on SQLite
        run: php namira/tests/admin-direct.php
      - name: Gallery facets and chip state on SQLite
        run: |
          php namira/tests/gallery-facets.php
          node namira/tests/gallery-filter-state.cjs
      - name: Simple eight-section form on SQLite
        run: php namira/tests/simple-martyr.php
      - name: Shared members and storefront tests on SQLite
        run: |
          php namira/tests/members.php
          node --check namira/public/assets/participation.js
          node --check namira/public/assets/storefront.js
      - name: Public UI and safe mobile account tests on SQLite
        run: |
          php namira/tests/public-ui.php
          node --check namira/public/assets/account-ui.js
      - name: Browser installer tests on SQLite
        run: php namira/tests/installer.php
      - name: MySQL behavior tests
        env:
          TEST_DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=namira_test;charset=utf8mb4'
          TEST_DB_USER: root
          TEST_DB_PASSWORD: test-only-password
        run: php namira/tests/run.php
      - name: Browser installer tests on MySQL
        env:
          TEST_DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=namira_test;charset=utf8mb4'
          TEST_INSTALL_DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=namira_test_installer;charset=utf8mb4'
          TEST_DB_USER: root
          TEST_DB_PASSWORD: test-only-password
        run: |
          php -r '$db=new PDO(getenv("TEST_DB_DSN"),getenv("TEST_DB_USER"),getenv("TEST_DB_PASSWORD"));$db->exec("CREATE DATABASE namira_test_installer CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");'
          php namira/tests/installer.php
      - name: Protocol acceptance tests on MySQL
        env:
          TEST_DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=namira_test;charset=utf8mb4'
          TEST_PROTOCOL_DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=namira_test_protocol;charset=utf8mb4'
          TEST_DB_USER: root
          TEST_DB_PASSWORD: test-only-password
        run: |
          php -r '$db=new PDO(getenv("TEST_DB_DSN"),getenv("TEST_DB_USER"),getenv("TEST_DB_PASSWORD"));$db->exec("CREATE DATABASE namira_test_protocol CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");'
          php namira/tests/protocol.php
      - name: Platform migration, SQL restore and admin tests on MySQL
        env:
          TEST_DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=namira_test;charset=utf8mb4'
          TEST_PLATFORM_DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=namira_test_platform;charset=utf8mb4'
          TEST_PLATFORM_RESTORE_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=namira_test_platform_restore;charset=utf8mb4'
          TEST_DB_USER: root
          TEST_DB_PASSWORD: test-only-password
        run: |
          php -r '$db=new PDO(getenv("TEST_DB_DSN"),getenv("TEST_DB_USER"),getenv("TEST_DB_PASSWORD"));$db->exec("CREATE DATABASE namira_test_platform CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");$db->exec("CREATE DATABASE namira_test_platform_restore CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");'
          php namira/tests/platform.php
      - name: Community workflows, quotas and SQL restore on MySQL
        env:
          TEST_DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=namira_test;charset=utf8mb4'
          TEST_COMMUNITY_DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=namira_test_community;charset=utf8mb4'
          TEST_COMMUNITY_RESTORE_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=namira_test_community_restore;charset=utf8mb4'
          TEST_DB_USER: root
          TEST_DB_PASSWORD: test-only-password
        run: |
          php -r '$db=new PDO(getenv("TEST_DB_DSN"),getenv("TEST_DB_USER"),getenv("TEST_DB_PASSWORD"));$db->exec("CREATE DATABASE namira_test_community CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");$db->exec("CREATE DATABASE namira_test_community_restore CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");'
          php namira/tests/community.php
      - name: Martyr catalog, reviewed filters and backup restore on MySQL
        env:
          TEST_DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=namira_test;charset=utf8mb4'
          TEST_CATALOG_DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=namira_test_catalog;charset=utf8mb4'
          TEST_CATALOG_RESTORE_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=namira_test_catalog_restore;charset=utf8mb4'
          TEST_DB_USER: root
          TEST_DB_PASSWORD: test-only-password
        run: |
          php -r '$db=new PDO(getenv("TEST_DB_DSN"),getenv("TEST_DB_USER"),getenv("TEST_DB_PASSWORD"));$db->exec("CREATE DATABASE namira_test_catalog CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");$db->exec("CREATE DATABASE namira_test_catalog_restore CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");'
          php namira/tests/martyr-catalog.php
      - name: Admin direct publishing on MySQL
        env:
          TEST_DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=namira_test;charset=utf8mb4'
          TEST_DIRECT_DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=namira_test_direct;charset=utf8mb4'
          TEST_DB_USER: root
          TEST_DB_PASSWORD: test-only-password
        run: |
          php -r '$db=new PDO(getenv("TEST_DB_DSN"),getenv("TEST_DB_USER"),getenv("TEST_DB_PASSWORD"));$db->exec("CREATE DATABASE namira_test_direct CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");'
          php namira/tests/admin-direct.php
      - name: Gallery facets on MySQL
        env:
          TEST_DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=namira_test;charset=utf8mb4'
          TEST_FACETS_DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=namira_test_facets;charset=utf8mb4'
          TEST_DB_USER: root
          TEST_DB_PASSWORD: test-only-password
        run: |
          php -r '$db=new PDO(getenv("TEST_DB_DSN"),getenv("TEST_DB_USER"),getenv("TEST_DB_PASSWORD"));$db->exec("CREATE DATABASE namira_test_facets CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");'
          php namira/tests/gallery-facets.php
      - name: Simple eight-section form on MySQL
        env:
          TEST_DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=namira_test;charset=utf8mb4'
          TEST_SIMPLE_DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=namira_test_simple;charset=utf8mb4'
          TEST_DB_USER: root
          TEST_DB_PASSWORD: test-only-password
        run: |
          php -r '$db=new PDO(getenv("TEST_DB_DSN"),getenv("TEST_DB_USER"),getenv("TEST_DB_PASSWORD"));$db->exec("CREATE DATABASE namira_test_simple CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");'
          php namira/tests/simple-martyr.php
      - name: Shared members and storefront tests on MySQL
        env:
          TEST_DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=namira_test;charset=utf8mb4'
          TEST_MEMBERS_DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=namira_test_members;charset=utf8mb4'
          TEST_DB_USER: root
          TEST_DB_PASSWORD: test-only-password
        run: |
          php -r '$db=new PDO(getenv("TEST_DB_DSN"),getenv("TEST_DB_USER"),getenv("TEST_DB_PASSWORD"));$db->exec("CREATE DATABASE namira_test_members CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");'
          php namira/tests/members.php
      - name: Public UI and safe mobile account tests on MySQL
        env:
          TEST_DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=namira_test;charset=utf8mb4'
          TEST_UI_DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=namira_test_ui;charset=utf8mb4'
          TEST_DB_USER: root
          TEST_DB_PASSWORD: test-only-password
        run: |
          php -r '$db=new PDO(getenv("TEST_DB_DSN"),getenv("TEST_DB_USER"),getenv("TEST_DB_PASSWORD"));$db->exec("CREATE DATABASE namira_test_ui CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");'
          php namira/tests/public-ui.php
      - name: Store catalog on SQLite
        run: php namira/tests/store-catalog.php
      - name: Store catalog on MySQL
        env:
          TEST_DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=namira_test;charset=utf8mb4'
          STORE_TEST_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=namira_test_store;charset=utf8mb4'
          TEST_DB_USER: root
          TEST_DB_PASSWORD: test-only-password
        run: |
          php -r '$db=new PDO(getenv("TEST_DB_DSN"),getenv("TEST_DB_USER"),getenv("TEST_DB_PASSWORD"));$db->exec("CREATE DATABASE namira_test_store CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");'
          php namira/tests/store-catalog.php
      - name: Complete store orders on SQLite
        env:
          STORE_UI_MANIFEST: storage/store-ui-fixture.json
        working-directory: namira
        run: php tests/store-orders.php
      - name: Complete store orders on MySQL
        env:
          TEST_DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=namira_test;charset=utf8mb4'
          STORE_ORDERS_TEST_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=namira_test_store_orders;charset=utf8mb4'
          TEST_DB_USER: root
          TEST_DB_PASSWORD: test-only-password
        run: |
          php -r '$db=new PDO(getenv("TEST_DB_DSN"),getenv("TEST_DB_USER"),getenv("TEST_DB_PASSWORD"));$db->exec("CREATE DATABASE namira_test_store_orders CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");'
          php namira/tests/store-orders.php
      - name: Complete calls on SQLite
        run: php namira/tests/calls.php
      - name: Complete calls on MySQL
        env:
          TEST_DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=namira_test;charset=utf8mb4'
          TEST_CALLS_DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=namira_test_calls;charset=utf8mb4'
          TEST_CALLS_RESTORE_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=namira_test_calls_restore;charset=utf8mb4'
          TEST_DB_USER: root
          TEST_DB_PASSWORD: test-only-password
        run: |
          php -r '$db=new PDO(getenv("TEST_DB_DSN"),getenv("TEST_DB_USER"),getenv("TEST_DB_PASSWORD"));$db->exec("CREATE DATABASE namira_test_calls CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");$db->exec("CREATE DATABASE namira_test_calls_restore CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");'
          php namira/tests/calls.php
      - name: Public and admin domain boundaries
        run: |
          php namira/tests/domain-routing.php public
          php namira/tests/domain-routing.php admin
          php namira/tests/domain-migration.php
          python3 namira/tests/domain-deploy.py
      - name: Independent domain database copy on MySQL
        env:
          TEST_DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=namira_test;charset=utf8mb4'
          TEST_DOMAIN_SOURCE_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=namira_test_domain_source;charset=utf8mb4'
          TEST_DOMAIN_TARGET_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=namira_test_domain_target;charset=utf8mb4'
          TEST_DB_USER: root
          TEST_DB_PASSWORD: test-only-password
        run: |
          php -r '$db=new PDO(getenv("TEST_DB_DSN"),getenv("TEST_DB_USER"),getenv("TEST_DB_PASSWORD"));$db->exec("CREATE DATABASE namira_test_domain_source CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");$db->exec("CREATE DATABASE namira_test_domain_target CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");'
          php namira/tests/domain-migration.php
      - name: Validate deployment script
        run: python3 -m py_compile namira/deploy/ftps.py
  store-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Isolated PHP browser fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-gd php-xml php-mbstring php-zip
          cd namira
          STORE_UI_MANIFEST=storage/store-ui-fixture.json php tests/store-orders.php
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test tools only in runner temporary directory
        run: |
          npm install --prefix "$RUNNER_TEMP/namira-browser" --no-package-lock --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/namira-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Mobile and desktop store end-to-end checks
        working-directory: namira
        env:
          NAMIRA_UI_MANIFEST: storage/store-ui-fixture.json
          STORE_UI_ARTIFACTS: storage/store-ui-artifacts
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/namira-browser/node_modules/playwright" node tests/store-ui.cjs
      - name: Responsive navigation and account menu checks
        working-directory: namira
        env:
          NAMIRA_UI_MANIFEST: storage/store-ui-fixture.json
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/namira-browser/node_modules/playwright" node tests/mobile-navigation-ui.cjs
      - name: Save navigation screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: namira-mobile-navigation
          path: namira/storage/navigation-ui-artifacts
          retention-days: 7
      - name: Save test screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: namira-store-browser
          path: namira/storage/store-ui-artifacts
          retention-days: 7
  calls-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Isolated calls database and private files
        working-directory: namira
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-gd php-xml php-mbstring php-zip
          CALLS_UI_MANIFEST=storage/calls-ui-fixture.json php tests/calls.php
      - name: Real HTTP checks across isolated public and admin hosts
        working-directory: namira
        run: python3 tests/domain-http.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test browser in runner only
        run: |
          npm install --prefix "$RUNNER_TEMP/namira-browser" --no-package-lock --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/namira-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Calls participant and secretariat end-to-end journey
        working-directory: namira
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/namira-browser/node_modules/playwright" node tests/calls-ui.cjs
      - name: Save calls browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: namira-calls-browser
          path: namira/storage/calls-ui-artifacts
          retention-days: 7
  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.NAMIRA_ENABLE_DIRECT_FTPS == 'true' }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Public_html/new using verified FTPS
        env:
          DEPLOY_FTPS_HOST: cp173.mihanvps.com
          DEPLOY_FTPS_USERNAME: ${{ secrets.DEPLOY_FTPS_USER }}
          DEPLOY_FTPS_PASSWORD: ${{ secrets.DEPLOY_FTPS_PASSWORD }}
          DEPLOY_FTPS_DIR: ${{ vars.DEPLOY_FTPS_DIR || 'Public_html/new' }}
          DEPLOY_FTPS_PORT: ${{ vars.DEPLOY_FTPS_PORT || '21' }}
          DEPLOY_SITE_URL: https://test.shahidpics.com
        run: python3 namira/deploy/ftps.py



