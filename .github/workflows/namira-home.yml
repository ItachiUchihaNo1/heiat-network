name: Namira home showcase checks
on:
  push:
    branches: ['codex/home-showcase']
    paths: ['namira/**', '.github/workflows/namira-home.yml']
  pull_request:
    paths: ['namira/**', '.github/workflows/namira-home.yml']
permissions:
  contents: read
jobs:
  data:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: namira_test_showcase
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ptest-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-mysql php-gd php-xml php-mbstring php-zip
      - name: PHP syntax and existing navigation
        run: |
          find namira/app namira/views -name '*.php' -print0 | xargs -0 -n1 php -l
          php namira/tests/mobile-navigation.php
      - name: Showcase storage publication permissions and upload checks on SQLite
        run: php namira/tests/home-showcase.php
      - name: Showcase storage publication permissions and upload checks on MySQL
        env:
          TEST_SHOWCASE_DB_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=namira_test_showcase;charset=utf8mb4'
          TEST_DB_USER: root
          TEST_DB_PASSWORD: test-only-password
        run: php namira/tests/home-showcase.php
      - name: Existing domain boundary checks
        run: |
          php namira/tests/domain-routing.php public
          php namira/tests/domain-routing.php admin
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-gd php-xml php-mbstring php-zip
          php namira/tests/home-showcase.php
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test browser only in runner temporary directory
        run: |
          npm install --prefix "$RUNNER_TEMP/namira-home-browser" --no-package-lock --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/namira-home-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Mobile desktop editor publication and private preview journey
        working-directory: namira
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/namira-home-browser/node_modules/playwright" node tests/home-showcase-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: namira-home-showcase-evidence
          path: namira/storage/home-showcase-artifacts
          retention-days: 14
